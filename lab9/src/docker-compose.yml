services:
  db:
    image: postgres:18
    container_name: room-booking-lab9
    environment:
      POSTGRES_DB: room_booking_lab9
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d room_booking_lab9"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: