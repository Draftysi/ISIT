
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование переговорных комнат</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Бронирование переговорных комнат</h1>

    <section>
        <h2>Создание бронирования</h2>

        <form id="bookingForm">
            <label for="room">Переговорная комната:</label>
            <select id="room" required>
                <option value="">Выберите комнату</option>
            </select>

            <label for="date">Дата:</label>
            <input type="date" id="date" required>

            <label for="startTime">Начало:</label>
            <input type="time" id="startTime" required>

            <label for="endTime">Окончание:</label>
            <input type="time" id="endTime" required>

            <label for="subject">Тема встречи:</label>
            <input type="text" id="subject" required>

            <label for="participants">Количество участников:</label>
            <input type="number" id="participants" min="1" required>

            <button type="submit">Создать бронирование</button>
        </form>
    </section>

    <section>
        <h2>Список бронирований</h2>

        <button id="loadButton">Загрузить с сервера</button>

        <label for="statusFilter">Статус:</label>
        <select id="statusFilter">
            <option value="">Все статусы</option>
            <option value="active">Активные</option>
            <option value="cancelled">Отменённые</option>
        </select>

        <input type="text" id="searchInput" placeholder="Поиск по теме встречи">

        <p id="message"></p>
        <p id="counter">Бронирований: 0</p>

        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Комната</th>
                    <th>Дата</th>
                    <th>Время</th>
                    <th>Тема встречи</th>
                    <th>Участники</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="bookingTable"></tbody>
        </table>
    </section>

    <script src="js/mock-data.js"></script>
    <script src="js/mock-api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
